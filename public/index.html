<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skribbl Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <section id="lobby" class="screen">
            <div class="card">
                <h2>🎨 Skribbl Clone</h2>
                <input id="playerName" type="text" placeholder="Enter your name" maxlength="20">
                <input id="roomInput" type="text" placeholder="Room ID to join" maxlength="6">
                <button id="createRoom">Create Room</button>
                <button id="joinRoom">Join Room</button>
                <p id="lobbyError" class="error"></p>
            </div>
        </section>

        <section id="game" class="screen hidden">
            <header class="topbar">
                <div><strong>Room:</strong> <span id="roomDisplay"></span></div>
                <div id="gameStatus">⏳ Waiting for game...</div>
                <div><strong>Time:</strong> <span id="timer">0</span></div>
                <div id="connectionStatus">🟡 Connecting...</div>
            </header>

            <main class="game-layout">
                <aside class="sidebar">
                    <h3>Players</h3>
                    <ul id="playerList"></ul>
                </aside>

                <section class="drawing-area">
                    <div class="word-box" id="wordLabel">🔤 Guess the word!</div>
                    <canvas id="canvas" width="800" height="500"></canvas>
                    <div class="tools">
                        <label>Brush <input id="brushSize" type="range" min="1" max="30" value="5"></label>
                        <button id="clearCanvas">Clear</button>
                    </div>
                </section>

                <aside class="chat-panel">
                    <h3>Chat / Guesses</h3>
                    <div id="messages" class="messages"></div>
                    <div class="chat-input">
                        <input id="messageInput" type="text" placeholder="Type your guess..." maxlength="100">
                        <button id="sendMessage">Send</button>
                    </div>
                </aside>
            </main>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
</body>
</html>
